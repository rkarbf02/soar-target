# was VM — /etc/netplan/01-network-manager-all.yaml
# 인터페이스 이름(ens32/ens35/ens36)은 실제 `ip a` 결과에 맞게 수정할 것.
# 서버 VM은 renderer를 networkd로 둔다 (NetworkManager는 인터페이스를 자동으로 안 켜는 경우가 있음).
#
# 적용:
#   sudo chmod 600 /etc/netplan/01-network-manager-all.yaml
#   sudo systemctl enable --now systemd-networkd
#   sudo netplan apply
network:
  version: 2
  renderer: networkd
  ethernets:
    ens32:                          # LAN1 (web↔was)
      dhcp4: no
      addresses: [192.168.20.20/24]
    ens35:                          # LAN2 (was↔db)
      dhcp4: no
      addresses: [192.168.30.20/24]
    ens36:                          # LAN3 (관리망)
      dhcp4: no
      addresses: [192.168.40.20/24]
    ens37:                          # NAT (인터넷, 임시)
      dhcp4: yes
